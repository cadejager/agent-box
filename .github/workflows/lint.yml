name: lint

on:
  pull_request:
  push:
    branches: [main, bubblewrap]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on the ubuntu-latest runner.
      - name: shellcheck
        run: shellcheck bin/agtbox.sh test/argv.sh
      - name: argv tests
        run: bash test/argv.sh
