name: lint

on:
  pull_request:
  push:
    branches: [main, bubblewrap, bubblewrap-podman]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # shellcheck is preinstalled on the ubuntu-latest runner.
      - name: shellcheck
        run: shellcheck bin/agtbox.sh test/argv.sh
      - name: py_compile (python launcher)
        run: python3 -m py_compile bin/agtbox.py
      - name: argv tests (bash launcher)
        run: bash test/argv.sh
      - name: argv tests (python launcher)
        run: AGTBOX_IMPL=agtbox.py bash test/argv.sh
