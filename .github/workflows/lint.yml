name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pipx is preinstalled on the ubuntu-latest runner; ruff runs ephemerally.
      - name: ruff
        run: pipx run ruff check bin/agtbox.py test/test_agtbox.py
      - name: tests
        run: python3 -m unittest discover -s test -v
